# Layered over agents-chronicle's mkdocs.yml by scripts/build-docs.sh: the same docs, served under /docs/ of
# chronicle.chatixia.net, in this site's type and colours, with the logo leading back to the home page.
INHERIT: mkdocs.yml
site_url: https://chronicle.chatixia.net/docs/

theme:
  # The site's own favicon (the app's icon at 32 px), not the 1024 px app icon the docs use as their logo
  favicon: assets/favicon.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono

extra_css:
  - assets/chronicle-site.css

extra:
  homepage: https://chronicle.chatixia.net/
