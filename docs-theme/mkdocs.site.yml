# Layered over agents-chronicle's mkdocs.yml by scripts/build-docs.sh: the same docs, served under /docs/ of
# interlatch.com, in this site's type and colours, with the logo leading back to the home page, and the
# Japanese pages under /docs/ja/ in Japanese throughout.
INHERIT: mkdocs.yml
site_name: Interlatch
site_description: Shared memory for your coding agents. Keep sessions, fixes and decisions with their project and source.
site_url: https://interlatch.com/docs/

theme:
  # Template overrides that make the 日本語 pages a Japanese site of their own (see overrides/): Japanese labels,
  # a navigation of their own, and a link to the same page in the other language
  custom_dir: site-overrides
  # The site's own favicon (the app's icon at 32 px), not the 1024 px app icon the docs use as their logo
  favicon: assets/favicon.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono

extra_css:
  - assets/chronicle-site.css

extra:
  homepage: https://interlatch.com/
