# Builds interlatch.com: the landing page (Astro, this repo) and the docs (MkDocs, from Chatixia-AI/interlatch,
# served under /docs/), then publishes them to Firebase Hosting (project interlatch, see README). Pull requests only
# build, so a broken page or docs link fails before it reaches main.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [docs-updated]  # sent by Chatixia-AI/interlatch when its docs change on main
  schedule:
    - cron: "17 3 * * *"  # daily, in case a docs change didn't send one

permissions: {}

# A pull request's newer push replaces its older build; runs that publish queue one after another, never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy-live' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Chatixia-AI/interlatch
          path: .cache/agents-chronicle
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.13.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
        env:
          CHRONICLE_SRC: .cache/agents-chronicle
      - run: scripts/build-docs.sh
        env:
          CHRONICLE_SRC: .cache/agents-chronicle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: dist
          path: dist
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist
      - uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a  # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_INTERLATCH }}
          projectId: interlatch
          channelId: live
